name: Test list hosts mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create inventory file
        run: |
          cat > $GITHUB_WORKSPACE/test-inventory.ini << 'EOF'
          [local]
          localhost ansible_connection=local
          EOF

      - name: Create playbook file
        run: |
          cat > $GITHUB_WORKSPACE/test-playbook.yml << 'EOF'
          ---
          - name: List hosts test playbook
            hosts: local
            gather_facts: false
            tasks:
              - name: Debug message
                ansible.builtin.debug:
                  msg: "Hello"
          EOF

      - id: action
        uses: .
        with:
          inventory: test-inventory.ini
          playbook: test-playbook.yml
          list_hosts: "true"

      - name: Assert list hosts outputs
        env:
          STATUS: ${{ steps.action.outputs.status }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "status: $STATUS"
          echo "exit_code: $EXIT_CODE"
          if [ "$STATUS" != "success" ]; then
            echo "FAIL: expected status 'success', got '$STATUS'"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit_code '0', got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"
