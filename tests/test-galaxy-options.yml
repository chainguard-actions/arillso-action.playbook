name: Test galaxy configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create inventory file
        run: |
          cat > /tmp/inventory.ini << 'EOF'
          [local]
          localhost ansible_connection=local
          EOF

      - name: Create playbook file
        run: |
          cat > /tmp/playbook.yml << 'EOF'
          ---
          - name: Test playbook
            hosts: local
            gather_facts: false
            tasks:
              - name: Echo hello
                ansible.builtin.debug:
                  msg: "Hello from test"
          EOF

      - name: Create galaxy requirements file
        run: |
          cat > /tmp/requirements.yml << 'EOF'
          ---
          collections: []
          roles: []
          EOF

      - name: Create galaxy file
        run: |
          cat > /tmp/galaxy.yml << 'EOF'
          ---
          collections: []
          roles: []
          EOF

      - id: action
        uses: .
        with:
          inventory: /tmp/inventory.ini
          playbook: /tmp/playbook.yml
          syntax_check: "true"
          galaxy_file: /tmp/galaxy.yml
          galaxy_force: "false"
          galaxy_api_key: "dummy-api-key"
          galaxy_api_server_url: "https://galaxy.ansible.com"
          galaxy_collections_path: "/tmp/galaxy-collections"
          galaxy_disable_gpg_verify: "true"
          galaxy_force_with_deps: "false"
          galaxy_ignore_certs: "true"
          galaxy_ignore_signature_status_codes: "404"
          galaxy_keyring: ""
          galaxy_offline: "false"
          galaxy_pre: "false"
          galaxy_required_valid_signature_count: "1"
          galaxy_requirements_file: /tmp/requirements.yml
          galaxy_signature: ""
          galaxy_timeout: "60"
          galaxy_upgrade: "false"
          galaxy_no_deps: "false"

      - name: Assert status output
        env:
          STATUS: ${{ steps.action.outputs.status }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "status: $STATUS"
          echo "exit_code: $EXIT_CODE"
          if [ "$STATUS" != "success" ]; then
            echo "FAIL: expected status 'success', got '$STATUS'"
            exit 1
          fi
          echo "PASS"
