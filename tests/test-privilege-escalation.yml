name: Test privilege escalation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create inventory file
        run: |
          cat > /tmp/inventory.ini << 'EOF'
          [local]
          localhost ansible_connection=local
          EOF

      - name: Create playbook file
        run: |
          cat > /tmp/playbook.yml << 'EOF'
          ---
          - name: Test playbook
            hosts: local
            gather_facts: false
            tasks:
              - name: Echo hello
                ansible.builtin.debug:
                  msg: "Hello from test"
          EOF

      - id: action
        uses: .
        with:
          inventory: /tmp/inventory.ini
          playbook: /tmp/playbook.yml
          syntax_check: "true"
          become: "true"
          become_method: "sudo"
          become_user: "root"

      - name: Assert status output
        env:
          STATUS: ${{ steps.action.outputs.status }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "status: $STATUS"
          echo "exit_code: $EXIT_CODE"
          if [ "$STATUS" != "success" ]; then
            echo "FAIL: expected status 'success', got '$STATUS'"
            exit 1
          fi
          echo "PASS"
