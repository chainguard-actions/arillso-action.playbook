name: Test basic playbook execution with syntax check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create inventory file
        run: |
          cat > /tmp/inventory.yml << 'EOF'
          all:
            hosts:
              localhost:
                ansible_connection: local
          EOF

      - name: Create playbook file
        run: |
          cat > /tmp/playbook.yml << 'EOF'
          ---
          - name: Test playbook
            hosts: localhost
            gather_facts: false
            tasks:
              - name: Hello task
                debug:
                  msg: "Hello from Ansible"
                tags:
                  - hello
          EOF

      - id: action
        uses: .
        with:
          inventory: /tmp/inventory.yml
          playbook: /tmp/playbook.yml
          syntax_check: "true"
          verbose: "1"
          extra_vars: "my_var=test_value"
          tags: "hello"
          skip_tags: "skip_this"
          limit: "localhost"
          forks: "2"
          output_file: /tmp/ansible_output.txt
          module_path: "/tmp/modules"
          check: "false"
          diff: "false"
          flush_cache: "false"
          force_handlers: "false"
          list_tasks: "false"
          list_tags: "false"
          list_hosts: "false"
          start_at_task: ""
          connection: "local"
          timeout: "30"
          user: "root"
          ssh_common_args: ""
          sftp_extra_args: ""
          scp_extra_args: ""
          ssh_extra_args: ""

      - name: Assert status output
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ "$STATUS" != "success" ] && [ "$STATUS" != "failed" ]; then
            echo "FAIL: expected status to be 'success' or 'failed', got '$STATUS'"
            exit 1
          fi
          echo "PASS"

      - name: Assert exit_code output
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "exit_code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: expected exit_code to be set"
            exit 1
          fi
          echo "PASS"
