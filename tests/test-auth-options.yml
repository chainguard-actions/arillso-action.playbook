name: Test authentication and connection inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create inventory file
        run: |
          cat > /tmp/inventory.ini << 'EOF'
          [local]
          localhost ansible_connection=local
          EOF

      - name: Create playbook file
        run: |
          cat > /tmp/playbook.yml << 'EOF'
          ---
          - name: Test playbook
            hosts: local
            gather_facts: false
            tasks:
              - name: Echo hello
                ansible.builtin.debug:
                  msg: "Hello from test"
          EOF

      - name: Generate test SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -q
          TEST_KEY=$(cat /tmp/test_key)
          echo "TEST_KEY<<EOF" >> $GITHUB_ENV
          echo "$TEST_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          inventory: /tmp/inventory.ini
          playbook: /tmp/playbook.yml
          syntax_check: "true"
          private_key: ${{ env.TEST_KEY }}
          private_key_passphrase: ""
          additional_private_keys: ""
          vault_id: "default"
          vault_password: "dummy-vault-password"
          user: "testuser"
          connection: "local"
          timeout: "30"
          ssh_common_args: "-o StrictHostKeyChecking=no"
          sftp_extra_args: "-P 22"
          scp_extra_args: "-P 22"
          ssh_extra_args: "-o ConnectTimeout=10"
          known_hosts: "localhost ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI"

      - name: Assert status output
        env:
          STATUS: ${{ steps.action.outputs.status }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "status: $STATUS"
          echo "exit_code: $EXIT_CODE"
          if [ "$STATUS" != "success" ]; then
            echo "FAIL: expected status 'success', got '$STATUS'"
            exit 1
          fi
          echo "PASS"
