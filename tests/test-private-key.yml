name: Test private key options
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Generate test SSH keys and export to env
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "testpassphrase" -q
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key2 -N "" -q
          {
            echo "TEST_PRIVATE_KEY<<EOF"
            cat /tmp/test_key
            echo "EOF"
            echo "TEST_PRIVATE_KEY2<<EOF"
            cat /tmp/test_key2
            echo "EOF"
          } >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          inventory: "${{ github.workspace }}/tests/fixtures/inventory/hosts.yml"
          playbook: "${{ github.workspace }}/tests/fixtures/playbooks/hello.yml"
          syntax_check: "true"
          private_key: "${{ env.TEST_PRIVATE_KEY }}"
          private_key_passphrase: "testpassphrase"
          additional_private_keys: "${{ env.TEST_PRIVATE_KEY2 }}"

      - name: Assert status is success
        env:
          ACTUAL: ${{ steps.action.outputs.status }}
        run: |
          echo "actual status: $ACTUAL"
          if [ "$ACTUAL" != "success" ]; then
            echo "FAIL: expected status 'success' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert exit code is 0
        env:
          ACTUAL: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "actual exit_code: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected exit_code '0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
